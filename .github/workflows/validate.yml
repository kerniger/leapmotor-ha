name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: python -m pip install 'requests>=2.31.0' 'cryptography>=42.0.0' voluptuous

      - name: Compile Python files
        run: python -m compileall -q custom_components/leapmotor

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify tag version on tagged builds
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("hacs.json"),
              Path("custom_components/leapmotor/manifest.json"),
              *Path("custom_components/leapmotor/translations").glob("*.json"),
          ]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok {path}")
          PY

      - name: Validate release ZIP layout
        run: |
          bash scripts/build_release_zip.sh /tmp/leapmotor-ha.zip
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile("/tmp/leapmotor-ha.zip") as archive:
              names = set(archive.namelist())
          assert "manifest.json" in names
          assert "__init__.py" in names
          assert "custom_components/leapmotor/manifest.json" not in names
          assert "app_cert.pem" not in names
          assert "app_key.pem" not in names
          assert not {name for name in names if name.lower().endswith(".zip")}
          print("ok release ZIP layout")
          PY

      - name: Check forbidden files
        run: |
          test ! -e custom_components/leapmotor/app_cert.pem
          test ! -e custom_components/leapmotor/app_key.pem
          ! find . -name '*.p12' -o -name '*.log' | grep .

      - name: Secret pattern scan
        run: |
          ! grep -RIE \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE|192\.168\.' \
            --exclude-dir=.git \
            --exclude='validate.yml' \
            --exclude='config_flow.py' \
            --exclude='README.md' \
            --exclude='LEGAL.md' \
            --exclude='SECURITY.md' \
            .

          # Synthetic proxy URLs and rejected credential URLs are intentional in tests.
          # Private-key, certificate and local-address checks above still cover them.
          ! grep -RIE '[[:alnum:]_%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
            --exclude-dir=.git --exclude-dir=tests --exclude-dir=tools \
            --exclude='validate.yml' --exclude='config_flow.py' \
            --exclude='README.md' --exclude='LEGAL.md' --exclude='SECURITY.md' .

  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant runtime
        run: python -m pip install 'homeassistant==2025.12.5' 'requests>=2.31.0'
      - name: Test synthetic CN lifecycle
        run: python tools/ha_cn_runtime.py -v
      - name: Test region isolation and existing EU entries
        run: python tools/ha_region_runtime.py -v
      - name: Test diagnostics, entity defaults and T03 service boundary offline
        run: python tools/ha_issue_runtime.py -v
